name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore FindFont.slnx

      - name: Build
        run: dotnet build FindFont.slnx -c Release --no-restore

      - name: Smoke tests
        run: dotnet run --project tests/FindFont.SmokeTests/FindFont.SmokeTests.csproj -c Release --no-build

      - name: Publish app
        run: dotnet publish src/FindFont.App/FindFont.App.csproj -c Release -o publish

      - name: Build launcher
        run: dotnet build src/FindFont.Launcher/FindFont.Launcher.csproj -c Release

      - name: Copy launcher into publish
        shell: pwsh
        run: Copy-Item "src/FindFont.Launcher/bin/Release/net48/FindFont.exe" "publish/FindFont.exe" -Force

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/*" -DestinationPath "dist/find-font-win-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: find-font-win-x64
          path: dist/find-font-win-x64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/find-font-win-x64.zip
          generate_release_notes: true
