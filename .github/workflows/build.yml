name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      # 版本号只写在 version.txt 里。tag 与它不一致时直接失败，
      # 否则会出现「用新 tag 发旧版本号」这种对不上的发布。
      - name: Check tag matches version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          if ("v$version" -ne $tag) {
            Write-Error "tag $tag 与 version.txt ($version) 不一致，请先改 version.txt"
            exit 1
          }

      - name: Restore
        run: dotnet restore FindFont.slnx

      - name: Build
        run: dotnet build FindFont.slnx -c Release --no-restore

      - name: Smoke tests
        run: dotnet run --project tests/FindFont.SmokeTests/FindFont.SmokeTests.csproj -c Release --no-build

      - name: Publish app
        run: dotnet publish src/FindFont.App/FindFont.App.csproj -c Release -o publish

      - name: Build launcher
        run: dotnet build src/FindFont.Launcher/FindFont.Launcher.csproj -c Release

      - name: Copy launcher into publish
        shell: pwsh
        run: Copy-Item "src/FindFont.Launcher/bin/Release/net48/FindFont.exe" "publish/FindFont.exe" -Force

      - name: Package portable zip
        shell: pwsh
        run: |
          # 调试符号对使用者无意义，且会让未压缩体积翻倍。
          Get-ChildItem publish -Filter *.pdb -Recurse | Remove-Item -Force
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = (Get-Content version.txt -Raw).Trim()
          Compress-Archive -Path "publish/*" -DestinationPath "dist/find-font-$version-win-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: find-font-win-x64
          path: dist/find-font-*-win-x64.zip
          if-no-files-found: error

      # 只在 tag 上跑，且 release 正文由人工维护（generate_release_notes 会用
      # 自动 changelog 覆盖掉手写的下载说明，还会额外要求一次 release-notes 权限）。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/find-font-*-win-x64.zip
          generate_release_notes: false
